name: Build VPM Listing

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Website/**"
      - ".github/workflows/build-listing.yml"
  workflow_run:
    workflows:
      - Build Release
    types:
      - completed
  release:
    types:
      - published
      - created
      - edited
      - deleted
      - released

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  LIST_PUBLISH_DIRECTORY: Website
  CI_PATH: ci
  PACKAGE_NAME: com.nekoneko.nn-lighting-sync

jobs:
  build-listing:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Local Repository
        uses: actions/checkout@v4

      - name: Checkout VRChat Package Listing Builder
        uses: actions/checkout@v4
        with:
          repository: vrchat-community/package-list-action
          path: ${{ env.CI_PATH }}
          clean: false

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CI_PATH }}/.nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj') }}

      - name: Build Package Version Listing
        shell: bash
        run: |
          ${{ env.CI_PATH }}/build.cmd BuildRepoListing             --root ${{ env.CI_PATH }}             --list-publish-directory "$GITHUB_WORKSPACE/${{ env.LIST_PUBLISH_DIRECTORY }}"             --current-package-name "${{ env.PACKAGE_NAME }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.LIST_PUBLISH_DIRECTORY }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
